[project]
name = "orchai"
version = "0.2.5"
description = "Generic AI-assisted software development orchestration system."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=23.1",
    "fastapi>=0.116",
    "httpx>=0.28",
    "litellm>=1.55",
    "pydantic>=2.11",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "sqlalchemy>=2.0",
    "typer>=0.16",
    "uvicorn>=0.35",
]

[project.optional-dependencies]
# OrchAI Desktop shell (ADR-017) — a separate deployment shape from the
# headless CLI/API. Not part of the core dependency set: the backend
# must remain fully usable (and testable) without a GUI toolkit.
desktop = ["pywebview>=5.3"]

[project.scripts]
orchai = "orchai.interfaces.cli.main:app"

[dependency-groups]
dev = [
    "httpx2>=2.12",
    "pytest>=8.4",
    "ruff==0.15.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Not the pytest default (".pytest_cache"): that exact directory in this
# repository checkout has a broken ACL (created under a different
# Windows account/session context) that denies access -- including
# listing, renaming, or deleting it -- to every account tested since,
# always producing "PytestCacheWarning: could not create cache path ...
# Acesso negado" on every run. A fresh, never-before-used directory name
# sidesteps it entirely rather than fighting the ACL.
cache_dir = ".cache/pytest"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
"src/orchai/interfaces/cli/main.py" = ["B008"]
