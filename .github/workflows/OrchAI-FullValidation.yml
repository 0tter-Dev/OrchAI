name: OrchAI - Full Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --dev

      - name: Check lockfile consistency
        run: uv lock --check

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest --basetemp=.pytest-tmp/ci-${{ github.run_id }}-${{ github.run_attempt }}

      - name: CLI smoke
        run: uv run orchai --help
