name: OrchAI - Release Validation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate, for example v0.1.11"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Validate Tag And Generate Notes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --dev

      - name: Validate release tag
        run: uv run python scripts/release.py validate-tag --tag "${{ inputs.tag }}"

      - name: Generate release notes
        run: uv run python scripts/release.py generate-notes --tag "${{ inputs.tag }}" --output runtime/release-notes.md

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: orchai-release-notes-${{ inputs.tag }}
          path: runtime/release-notes.md
          if-no-files-found: error
